[project]
name = "smarthome"
version = "0.2.0"
description = "Собственный умный дом, совместимый с Яндекс Домом"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiomqtt>=2.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smarthome = "smarthome.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smarthome*"]

[tool.setuptools.package-data]
smarthome = ["web/static/*"]

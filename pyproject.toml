[project]
name = "smarthome"
version = "0.1.0"
description = "Собственный умный дом, совместимый с Яндекс Домом"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smarthome = "smarthome.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smarthome*"]

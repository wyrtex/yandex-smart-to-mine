name: SmartHome
options:
  bundleIdPrefix: com.wyrtex
  deploymentTarget:
    iOS: "15.0"
targets:
  SmartHome:
    type: application
    platform: iOS
    sources:
      - SmartHome
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: SmartHome
        PRODUCT_BUNDLE_IDENTIFIER: com.wyrtex.smarthome
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
